<html lang="en">
<head>

<title>ELO Docker Installer</title>
<script>
  // Theme before first paint: "auto" follows the system; "light"/"dark" are explicit choices (remembered).
  try { const th = localStorage.getItem('elo-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch {}
</script>
<style>
:root { --bg:#0f141b; --sur:#161d26; --sur2:#1d2632; --border:#2a3646; --text:#e7edf4; --muted:#8c9aab; --accent:#f28c1f;
  --accent2:#5aa2ff; --green:#38c172; --amber:#e3a008; --red:#ef4444; --log:#0a0e13; --logtext:#cfd8e3; --mono:'Cascadia Code',Consolas,monospace; color-scheme: dark; }
:root[data-theme=light] { --bg:#f4f6f9; --sur:#fff; --sur2:#eef2f7; --border:#d6dde6; --text:#1b2430; --muted:#5d6b7c; --accent:#d9730d;
  --accent2:#1d6fe0; --green:#1f8f4e; --amber:#a86d00; --red:#c62828; --log:#1b2430; --logtext:#e7edf4; color-scheme: light; }
@media (prefers-color-scheme: light) { :root:not([data-theme=dark]) { --bg:#f4f6f9; --sur:#fff; --sur2:#eef2f7; --border:#d6dde6; --text:#1b2430;
  --muted:#5d6b7c; --accent:#d9730d; --accent2:#1d6fe0; --green:#1f8f4e; --amber:#a86d00; --red:#c62828; --log:#1b2430; --logtext:#e7edf4; color-scheme: light; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif; }

header .logo { width:28px; height:28px; background:linear-gradient(135deg,#f6a23a,#e2620c); border-radius:4px; flex:none; }
header h1 { font-size:16px; margin:0; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; } .tabs button { background:none; border:0; color:var(--muted); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
.tabs button.on { background:var(--sur2); color:var(--text); }
.hright { margin-left:auto; display:flex; gap:8px; align-items:center; } .hright select, .hright button { background:var(--sur2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer; }
.env { color:var(--muted); font-size:12px; }

main.single { grid-template-columns:1fr; }
@media (max-width: 780px) { main { grid-template-columns:1fr; } nav.steps { display:flex; overflow-x:auto; border-right:0 !important; border-bottom:1px solid var(--border); } }
nav.steps { border-right:1px solid var(--border); padding:16px 10px; background:var(--sur); }
nav.steps div { display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); white-space:nowrap; }
nav.steps div.on { background:var(--sur2); color:var(--text); }
nav.steps .n { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--border); font-size:12px; flex:none; }
nav.steps div.done .n { background:var(--green); border-color:var(--green); color:#fff; } nav.steps div.on .n { border-color:var(--accent); color:var(--accent); }
section.page { padding:22px 26px; max-width:1100px; width:100%; }
h2 { margin:0 0 4px; font-size:20px; } .lead { color:var(--muted); margin:0 0 18px; }
.explain { background:var(--sur2); border-left:3px solid var(--accent2); padding:10px 14px; border-radius:6px; margin:0 0 16px; color:var(--muted); font-size:13px; }
.banner { border:1px solid var(--green); background:color-mix(in srgb, var(--green) 10%, var(--sur)); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.card { background:var(--sur); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px 14px; }
.grid2 > div { display:flex; flex-direction:column; justify-content:flex-end; min-width:0; } .grid2 > div > label { line-height:1.3; }
.grid2 input[type=text], .grid2 input[type=number], .grid2 input[type=password], .grid2 select { width:100%; box-sizing:border-box; }
.spin { display:inline-block; width:.85em; height:.85em; margin-right:6px; vertical-align:-.12em; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
.pbar { height:14px; background:var(--sur2); border:1px solid var(--border); border-radius:7px; overflow:hidden; margin:8px 0 2px; } .pbar > div { height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--accent2)); transition:width .4s; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
input[type=text], input[type=password], input[type=number], select, textarea { width:100%; padding:8px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:13px; }
button.btn, a.btn { display:inline-block; padding:8px 16px; border-radius:6px; border:1px solid var(--border); background:var(--sur2); color:var(--text); cursor:pointer; font-size:13px; text-decoration:none; }
.primary { background:var(--accent) !important; border-color:var(--accent) !important; color:#fff !important; } .small { padding:3px 9px !important; font-size:12px !important; }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .right { margin-left:auto; }
.check { display:grid; grid-template-columns:22px auto minmax(0,1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--border); align-items:center; }
.check.wide { grid-template-columns:22px minmax(0,1fr); align-items:start; } .check.wide > div { min-width:0; }
.check:last-child { border-bottom:0; } .check .v { color:var(--muted); font-size:12px; text-align:left; white-space:pre; overflow-x:auto; min-width:0; padding-bottom:2px; }
.dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; } .ok { background:var(--green); } .warn { background:var(--amber); } .bad { background:var(--red); } .idle { background:var(--border); }
.tok { color:var(--green); } .twarn { color:var(--amber); } .tbad { color:var(--red); } .muted { color:var(--muted); font-size:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }

.progress { height:8px; background:var(--sur2); border-radius:4px; overflow:hidden; } .progress > div { height:100%; background:var(--accent); width:0; transition:width .4s; }
.steplist div { padding:3px 0; } .steplist div::before { content:'○ '; color:var(--muted); } .steplist div.done::before { content:'● '; color:var(--green); } .steplist div.cur::before { content:'◐ '; color:var(--accent); }
.bar { height:6px; background:var(--sur2); border-radius:3px; overflow:hidden; min-width:80px; } .bar > div { height:100%; background:var(--accent2); }
.pw { font-family:var(--mono); } [hidden] { display:none !important; } code { font-family:var(--mono); font-size:12px; }
.nav { display:flex; justify-content:space-between; margin-top:18px; }
.info { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1px solid var(--accent2); color:var(--accent2); font-size:11px; font-weight:700; cursor:pointer; margin-left:6px; background:none; padding:0; }
.tcard { margin:0; cursor:pointer; } .tcard.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.tcard.disabled { opacity:.45; cursor:not-allowed; }
.btn.danger { border-color:#c0392b; color:#e74c3c; } .btn.danger:hover { background:#c0392b22; }
.membar { display:flex; height:18px; border-radius:5px; overflow:hidden; margin:10px 0 8px; background:var(--sur2); }
.membar > div { height:100%; min-width:2px; }
.memlegend { gap:6px 16px; font-size:13px; } .memlegend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.mem-wsl { background:#3b82f6; } .mem-hyperv { background:#8b5cf6; } .mem-vbox { background:#14b8a6; } .mem-desktop { background:#f59e0b; }
.mem-system { background:#94a3b8; } .mem-free { background:var(--border); }
.membar .mem-hyperv + .mem-hyperv { border-left:1px solid #fff8; }
.pill { display:inline-block; padding:2px 8px; border:1px solid var(--line, #8884); border-radius:999px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div><h1 id="h-title"></h1>
  <div class="tabs" id="tabs"></div>
  <div class="hright">
    <span class="env" id="envinfo"></span>
    <select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select>
    <button id="themebtn" onclick="cycleTheme()"></button>
  </div>
</header>
<main id="install-view"><nav class="steps" id="steps"></nav><section class="page" id="page"></section></main>
<main id="admin-view" class="single" hidden><section class="page" style="max-width:1250px" id="admin-page"></section></main>
<main id="containers-view" class="single" hidden><section class="page" style="max-width:1250px" id="containers-page"></section></main>
<div id="machine-views"></div>
<main id="help-view" class="single" hidden><section class="page" style="max-width:1000px" id="help-page"></section></main>

<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
// A button that triggers an async action shows a spinner until the action ends (functions wrapped at the end of the script).
let CLICKBTN = null;
document.addEventListener('click', ev => { const b = ev.target.closest?.('button'); if (b && !b.disabled) { CLICKBTN = b; setTimeout(() => { CLICKBTN = null; }, 0); } }, true);
function spinWrap(fn) {
  return function (...a) {
    const b = CLICKBTN; CLICKBTN = null;
    const res = fn.apply(this, a);
    if (!b || !b.isConnected || !res || typeof res.then !== 'function') return res;
    const html = b.innerHTML, dis = b.disabled; b.disabled = true; b.innerHTML = '<span class="spin"></span>' + html;
    const done = () => { if (b.isConnected) { b.innerHTML = html; b.disabled = dis; } };
    res.then(done, done); return res;
  };
}
const api = async (u, body) => {
  try {
    const r = await fetch('/api' + u, body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }), tx = await r.text();
    try { return JSON.parse(tx); } catch { return { ok:false, error: /^\s*</.test(tx) ? `The installer answered HTTP ${r.status} (not JSON) for ${u} — it is probably an older version or was restarted: restart it and reload this page.` : tx.slice(0, 300) }; }
  } catch (e) { return { ok:false, error:e.message }; }
};
// CLI secret / registry user remembered in this browser, encrypted: AES-GCM key (not extractable) in IndexedDB, ciphertext in localStorage.
const idb = () => new Promise((ok, ko) => { const q = indexedDB.open('elo-installer', 1); q.onupgradeneeded = () => q.result.createObjectStore('keys'); q.onsuccess = () => ok(q.result); q.onerror = () => ko(q.error); });
async function vaultKey() {
  const db = await idb();
  const k0 = await new Promise((ok, ko) => { const r = db.transaction('keys').objectStore('keys').get('k'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
  if (k0) return k0;
  const k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  await new Promise((ok, ko) => { const tx = db.transaction('keys', 'readwrite'); tx.objectStore('keys').put(k, 'k'); tx.oncomplete = ok; tx.onerror = () => ko(tx.error); });
  return k;
}
const b64 = u => btoa(String.fromCharCode(...u)), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function vaultSet(name, text) {
  try { const k = await vaultKey(), iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(text)));
    localStorage.setItem('elo-v-' + name, b64(iv) + '.' + b64(ct)); } catch {}
}
async function vaultGet(name) {
  try { const s = localStorage.getItem('elo-v-' + name); if (!s) return ''; const [iv, ct] = s.split('.');
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, await vaultKey(), unb64(ct))); } catch { return ''; }
}
const gb = b => b == null || isNaN(b) ? '' : (b / 1e9).toFixed(2) + ' GB';
const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'[b % 56]).join('');
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ── State ────────────────────────────────────────────────────────────────────
const W = { step: 0, done: new Set(), checks: null, inv: null, license: null, prov: null,
  cfg: { ELO_TAG: 'v25-0.30.1', ELO_SEARCH_TAG: 'v25-0.7', REPO: 'repository', ELO_DISPLAY_NAME: '', REPO_LANGUAGE: 'de', ELO_LICENSE_TYPE: '1',
    AUTH_ADMIN_USERNAME: 'Administrator', AUTH_ADMIN_PASSWORD: rnd(), AUTH_SERVICE_USERNAME: 'ELO Service', AUTH_SERVICE_PASSWORD: rnd(),
    DATABASE_USERNAME: 'elodb', DATABASE_PASSWORD: rnd(), IX_URL_PUBLIC: '', as: true, flows: true, pgadmin: true, fresh: true, eula: true,
    instance: '', wslMemGB: null, wslRestart: true, PORT_SERVER: 9090, PORT_AS: 9060, PORT_FLOWS: 9010, PORT_SEARCH: 9200, PORT_SEARCH_T: 9204, PORT_PGADMIN: 5050 },
  target: 'wsl', vm: { name: 'elo-docker', distro: 'ubuntu', ramGB: 16, cpus: 4, diskGB: 80 } };
// Administration / containers data is cached and only reloaded with Refresh (or after an action).
const CACHE = { status: null, images: null, containers: null, at: {} };
let VIEW = 'install';

const TABS = ['install', 'admin', 'containers', 'help'];
const STEPS = [['step.welcome', welcome], ['step.req', requirements], ['step.registry', registry], ['step.images', images],
  ['step.license', license], ['step.config', config], ['step.install', install], ['step.tests', tests], ['step.access', access]];

// ── Shell: language, theme, tabs ─────────────────────────────────────────────
function setLang(l) { LANG = l; store('elo-lang', l); document.documentElement.lang = l; shell(); show(VIEW, true); }
function themeState() { return document.documentElement.dataset.theme || 'auto'; }
function cycleTheme() {
  const next = { auto: 'light', light: 'dark', dark: 'auto' }[themeState()];
  if (next === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  store('elo-theme', next); shell();
}
function shell() {
  $('h-title').textContent = t('app.title'); $('lang').value = LANG;
  $('themebtn').textContent = t('theme.' + themeState());
  $('tabs').innerHTML = TABS.map(n => `<button class="${VIEW === n ? 'on' : ''}" onclick="show('${n}')">${t('tab.' + n)}</button>`).join('') +
    MT.list.map((m, n) => `<button class="${VIEW === 'm:' + n ? 'on' : ''}" title="${esc(m.typeLabel || '')}" onclick="show('m:${n}')">▣ ${esc(m.name)}</button>`).join('');
}
const SHOWN = {};
// One tab per running stack / virtual machine (from the installations list); content is built once and kept.
const MT = { list: [], tunnels: {} };
function syncMachineTabs(r) {
  if (!r?.ok) return;
  const run = r.installations.filter(i => i.state === 'running');
  const same = run.length === MT.list.length && run.every((i, n) => i.id === MT.list[n].id);
  if (same) { MT.list = run; return; }
  const cur = VIEW.startsWith('m:') ? MT.list[+VIEW.slice(2)]?.id : null;
  MT.list = run;
  for (const k of Object.keys(SHOWN)) if (k.startsWith('m:')) delete SHOWN[k];
  document.querySelectorAll('#machine-views > main').forEach(d => d.remove());
  if (cur) { const n = run.findIndex(i => i.id === cur); VIEW = n >= 0 ? 'm:' + n : 'admin'; }
  shell(); if (VIEW.startsWith('m:')) show(VIEW);
}
const mvPaths = { server: [['Web Client', 'plugin/de.elo.ix.plugin.proxy/web/'], ['Admin Console', 'plugin/de.elo.ix.plugin.proxy/ac/'], ['IX', 'ix?cmd=status']], as: [['Automation Services', '']], flows: [['Flows', '']], pgadmin: [['pgAdmin', '']] };
async function renderMachine(n) {
  const i = MT.list[n]; if (!i) return;
  let box = $('mv-' + n);
  if (!box) { document.getElementById('machine-views').insertAdjacentHTML('beforeend', `<main id="mv-${n}" class="single"><section class="page" style="max-width:1100px"></section></main>`); box = $('mv-' + n); }
  const pg = box.querySelector('section');
  pg.innerHTML = `<div class="row"><h2>${esc(i.name)}</h2><span class="muted">${esc(i.typeLabel || '')} · ${esc(i.detail || '')}</span>${refreshBtn('renderMachine(' + n + ')')}</div><p class="muted">${t('a.loading')}</p>`;
  const [cr, ac, tl] = await Promise.all([i.instance ? api('/stack/credentials?instance=' + encodeURIComponent(i.instance)) : { ok: false }, api('/access?id=' + encodeURIComponent(i.id)), api('/tunnel/list')]);
  MT.tunnels = tl.ok ? tl.tunnels : {};
  const host = /^local:/.test(i.id) ? 'localhost' : (ac.ssh?.host || ac.windows?.ip || 'localhost');
  const pt = cr.ok && cr.ports ? cr.ports : null, repo = cr.repo || 'repository';
  const svc = pt ? [['server', pt.server], ['as', pt.as], ['flows', pt.flows], ['pgadmin', pt.pgadmin]] : [];
  const reach = svc.length ? (await api('/reach', { host, ports: svc.map(s => s[1]) })).reach || {} : {};
  const tun = MT.tunnels[i.id], blocked = svc.some(([, p]) => reach[p] === false) && !tun, canTunnel = !!ac.ssh && !i.container;
  const urls = svc.flatMap(([k, p]) => (mvPaths[k] || []).map(([label, path]) => {
    const lp = tun ? tun[p] : p, h = tun ? '127.0.0.1' : host, u = `http://${h}:${lp}/${k === 'server' ? repo + '/' : ''}${path}`;
    return `<tr><td>${label}</td><td><a target="_blank" rel="noopener" href="${esc(u)}">${esc(u)}</a></td><td class="muted">${tun ? '→ ' + p : (reach[p] === false ? '✗' : '✔')}</td></tr>`; })).join('');
  pg.innerHTML = `<div class="row"><h2>${esc(i.name)}</h2><span class="muted">${esc(i.typeLabel || '')} · ${esc(i.detail || '')}</span>${refreshBtn('renderMachine(' + n + ')')}</div>
    ${cr.ok && !cr.noenv ? `<div class="card"><b>${t('a.creds')}</b> <span class="muted">· ELO ${esc(cr.tag || '?')} · ${esc(cr.instance)} · ${esc(repo)}</span>
      <table>${Object.entries(cr.credentials).map(([k, [u, p]]) => `<tr><td>${esc(k)}</td><td>${esc(u)}</td><td><code>${esc(p || '')}</code></td></tr>`).join('')}</table></div>` : ''}
    <div class="card"><b>${t('mv.access')}</b>${ac.ok ? `<table>
      ${ac.ssh ? `<tr><td>SSH</td><td><code>${esc(ac.ssh.command)}</code></td></tr><tr><td>${t('m.user')}</td><td>${esc(ac.ssh.user)}${ac.ssh.password ? ' · <code>' + esc(ac.ssh.password) + '</code>' : ''} <span class="muted">${esc(ac.ssh.host)}:${ac.ssh.port}</span></td></tr>` : ''}
      ${ac.windows ? `<tr><td>Windows</td><td>${esc(ac.windows.user)} · <code>${esc(ac.windows.password || '')}</code> <span class="muted">${esc(ac.windows.ip || '')}</span></td></tr><tr><td>RDP</td><td><code>${esc(ac.windows.mstsc)}</code></td></tr>` : ''}
      </table>` : `<p class="muted">${/^local:/.test(i.id) ? 'localhost (WSL / Docker on this computer)' : esc(ac.error || '')}</p>`}
      <div class="row" style="margin-top:6px"><button class="btn small" onclick="openTerminal('${esc(i.id)}','${esc(i.name)}')">&gt;_ ${t(ac.windows ? 'acc.psTerm' : 'acc.term')}</button></div></div>
    ${svc.length ? `<div class="card"><div class="row"><b>URLs</b>${tun ? `<span class="tok">${t('mv.tunnelOn')}</span><button class="btn small right" onclick="mvTunnel(${n}, false)">${t('mv.closeTunnel')}</button>`
        : blocked ? `<span class="twarn">${t('mv.unreachable', { host: esc(host) })}</span>${canTunnel ? `<button class="btn small primary right" onclick="mvTunnel(${n}, true)">${t('mv.openTunnel')}</button>` : ''}` : ''}</div>
      <div class="tablewrap"><table>${urls}</table></div><div id="mv-msg-${n}" class="muted"></div></div>` : ''}
    <div class="card"><div class="row"><b>${t('mv.bs')}</b><button class="btn small right" onclick="mvBs(${n})">${t('mv.bsLoad')}</button>
      <button class="btn small" onclick="openJavaClient()">${t('jc.open')}</button></div><p class="muted" style="margin:4px 0">${t('mv.bsNote')}</p><div id="mv-bs-${n}"></div></div>`;
}
async function mvTunnel(n, open) {
  const i = MT.list[n], m = $('mv-msg-' + n);
  const cr = i.instance ? await api('/stack/credentials?instance=' + encodeURIComponent(i.instance)) : null, pt = cr?.ports;
  const r = open ? await api('/tunnel/open', { id: i.id, ports: pt ? [pt.server, pt.as, pt.flows, pt.pgadmin] : [9090, 9060, 9010, 5050] }) : await api('/tunnel/close', { id: i.id });
  if (!r.ok) { if (m) m.innerHTML = `<span class="tbad">${esc(r.error)}</span>`; return; }
  renderMachine(n);
}
async function mvBs(n) {
  const el = $('mv-bs-' + n); el.textContent = t('m.working');

function show(v, rerender) {

// ── Wizard frame ─────────────────────────────────────────────────────────────
function go(i) { W.step = i; markStep(); render(); }
// Commands executed while on a step: remember the history position when entering it.
async function markStep() { W.stepSince = (await api('/commands?since=999999999')).last || 0; }
const cmdsPanel = () => `<details class="card cmds" style="margin-top:14px" ontoggle="if(this.open)loadCmds(this)"><summary style="cursor:pointer"><b>${t('cmd.title')}</b> <span class="muted">${t('cmd.note')}</span></summary><div style="margin-top:8px"></div></details>`;

  SHOWN.install = true;
  $('steps').innerHTML = STEPS.map(([k], i) => `<div class="${i === W.step ? 'on' : ''} ${W.done.has(i) ? 'done' : ''}" onclick="go(${i})"><span class="n">${W.done.has(i) ? '✓' : i + 1}</span>${t(k)}</div>`).join('');

// Generic job runner: streams a job log into an element; handles __STEP__/__CHECK__/__REBOOT__/__EXIT__ lines.
function stream(id, onLine, onDone) {
  const es = new EventSource(`/api/jobs/${id}/stream`);
  es.onmessage = ev => { const line = JSON.parse(ev.data); onLine(line); if (line.startsWith('__EXIT__:')) { es.close(); onDone?.(line.endsWith(':0')); } };
  es.onerror = () => es.close();
}
async function runJob(endpoint, body, el, onDone, onLine) {
  el.innerHTML = '<div class="steplist"></div><div class="pbar" hidden><div></div></div><div class="muted pl" hidden></div><pre class="log" style="margin-top:8px"></pre>';
  const list = el.querySelector('.steplist'), log = el.querySelector('pre'), steps = [], pb = el.querySelector('.pbar'), pl = el.querySelector('.pl');
  const j = await api(endpoint, body);
  if (!j.id) { log.textContent = j.error || 'error'; return; }
  stream(j.id, line => {
    if (line.startsWith('__STEP__ ')) { steps.push(line.slice(9)); list.innerHTML = steps.map((s, i) => `<div class="${i < steps.length - 1 ? 'done' : 'cur'}">${esc(s)}</div>`).join(''); return; }
    const pm = /^__PROGRESS__ (\d+)\/(\d+) ?(.*)$/.exec(line);
    if (pm) { const pct = Math.round(+pm[1] / +pm[2] * 100); pb.hidden = pl.hidden = false; pb.firstElementChild.style.width = pct + '%'; pl.textContent = `${pm[1]}/${pm[2]} · ${pct}% · ${pm[3]}`; return; }
    onLine?.(line);
    if (line.startsWith('__REBOOT__ ')) { list.insertAdjacentHTML('beforeend', `<p class="twarn"><b>${t('job.reboot')}:</b> ${esc(line.slice(11))}</p>`); return; }
    if (line.startsWith('__EXIT__:')) { list.querySelectorAll('div').forEach(d => d.className = 'done'); if (!pb.hidden && line.trim() === '__EXIT__:0') { pb.firstElementChild.style.width = '100%'; pl.textContent = '100%'; } return; }
    log.textContent += line + '\n'; log.scrollTop = 1e9;
  }, ok => { if (ok && !pb.hidden) { pb.firstElementChild.style.width = '100%'; pl.textContent = '100% ✔'; } onDone?.(ok); });
}

const CORE = ['server', 'ix-setup', 'ix-import', 'search', 'tr2', 'as', 'flows', 'flows-worker'];

const tagKey = tg => { const m = String(tg).match(/^v(\d+)-(\d+)(?:\.(\d+))?(?:\.(\d+))?(.*)$/); return m ? [1, +m[1], +m[2], +(m[3] || 0), +(m[4] || 0), m[5] ? 0 : 1, m[5]] : [0, 0, 0, 0, 0, 0, tg]; };
const compareTags = (a, b) => { const x = tagKey(a), y = tagKey(b); for (let i = 0; i < 6; i++) if (x[i] !== y[i]) return y[i] - x[i]; return String(x[6]).localeCompare(String(y[6])); };

// Per image of the selected version: in Docker (green), in the local cache (blue), or to download (grey).

// 5-minute countdown; every 30 s the backend checks IX (and Automation Services / Flows when enabled).
function stkWatch(startedAt, name) {
  stkStop(); STK.until = startedAt + 5 * 60000;
  let phase = 'stopping', health = null;
  const draw = () => {
    const left = Math.max(0, Math.round((STK.until - Date.now()) / 1000)), mm = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    const dot = (ok, need, n) => need ? `<span class="${ok ? 'tok' : 'muted'}">${ok ? '✔' : '…'} ${n}</span>` : '';
    stkMsg(`<span class="dot warn"></span> ${t(phase === 'stopping' ? 'stk.stopping' : phase === 'starting' ? 'stk.starting' : 'stk.waiting', { name: esc(name), left: mm })}
      ${health ? ' · ' + dot(health.ix, true, 'IX') + ' ' + dot(health.as, health.need.as, 'AS') + ' ' + dot(health.flows, health.need.flows, 'Flows') : ''}`);
    if (left === 0) { stkStop(); stkMsg(`<span class="twarn">${t('stk.timeout', { name: esc(name) })}</span>`); }
  };
  const check = async () => {
    const s = await api('/stack/switch'); if (!s.ok || !s.switch) return;
    phase = s.switch.phase; health = s.health || null;
    if (phase === 'error') { stkStop(); return stkMsg(`<span class="tbad">${esc(s.switch.error)}</span>`); }
    if (phase === 'done' || health?.active) { stkStop(); CACHE.status = null; stkMsg(`<span class="dot ok"></span> <b class="tok">${t('stk.active', { name: esc(name) })}</b>`); CACHE.inst = null; renderEngine(true); renderInstallations(true); }
  };
  draw(); STK.tick = setInterval(draw, 1000);
  setTimeout(check, 3000); STK.poll = setInterval(check, 30000);
}

const kOut = txt => { const o = $('k-out'); if (o) { o.hidden = false; o.textContent = txt; } };
async function ctr(action, name) { kOut(t('m.working')); const r = await api('/container', { action, name }); kOut(r.ok ? r.out : r.error); CACHE.status = null; renderContainers(true); }
async function rmImage(ref) { const r = await api('/images/remove', { refs: [ref] }); kOut(r.ok ? r.out : r.error); renderContainers(true); }
function backupImgs(refs) { runJob('/backup', { images: [...new Set(refs)] }, $('k-job'), () => renderContainers(true)); }
function loadTar(file) { runJob('/images/load', { file }, $('k-job'), () => renderContainers(true)); }

  const d = await api('/docs');

  <div class="card"><b>${t('h.files')}</b> <span class="muted">${t('h.filesNote')}</span>
    <table>${(d.local || []).map(f => `<tr><td><a target="_blank" href="${esc(f.url)}">${esc(f.name)}</a></td><td class="muted">${esc(f.where)}</td></tr>`).join('') || `<tr><td class="muted">${t('m.none')}</td></tr>`}</table></div>
  <div class="card"><b>${t('cli.title')}</b>${t('cli.steps')}
        <p style="margin-top:8px"><b>${t('cli.pdf')}</b> <a href="/help/docs/en-us_consultingops-opsletter_ubuntu.pdf" target="_blank" rel="noopener">📄 English (PDF)</a> ·
          <a href="/help/docs/de-de_consultingops-opsletter_ubuntu.pdf" target="_blank" rel="noopener">📄 Deutsch (PDF)</a></p></div>
  <div class="card"><b>${t('h.online')}</b> <span class="muted">${t('h.onlineNote')}</span>
    <table>${(d.online || []).map(f => `<tr><td>${esc(f.name)}</td><td><a target="_blank" href="${esc(f.url)}">${esc(f.url)}</a></td></tr>`).join('')}</table></div>
  <div class="card"><b>${t('h.how')}</b><ul>${[1, 2, 3, 4, 5].map(n => `<li>${t('h.how' + n)}</li>`).join('')}</ul></div>`;
}

// ── Start: environment + detection of an existing installation ──────────────
// Readable label of the installer's environment (the mode names are internal: wsl-user, wsl, linux, ssh).
const envLabel = e => e.mode === 'ssh' ? t('env.ssh', { host: `${e.target.user}@${e.target.host}` }) : e.mode === 'wsl-user' ? t('env.wslUser', { distro: e.distro || '' })
  : e.mode === 'wsl' ? t('env.wsl', { distro: e.distro || '' }) : e.mode === 'linux' ? t('env.linux') : e.mode;
async function refreshEnv() { const e = await api('/target'); $('envinfo').textContent = e.ok ? envLabel(e) : ''; $('envinfo').title = e.ok ? `mode: ${e.mode}` : ''; }
(async () => {
  document.documentElement.lang = LANG; shell();
  const tg = await api('/target');               // start on the current target (e.g. a VM over SSH)
  W.isWindows = !!tg.isWindows;
  if (tg.mode === 'ssh') W.target = tg.target.kind || 'server';
  else if (tg.mode === 'linux') W.target = 'native';
  render(); refreshEnv();
  api('/installations').then(r => { CACHE.inst = r; syncMachineTabs(r); });   // tabs of the running stacks / machines
  await loadStatus();                       // detected installation → banner on the welcome page
  if (VIEW === 'install' && W.step === 0) welcome();
})();
// Spinner on every button whose action is asynchronous.
for (const n of ["stkCreds","memFree","instAction","svc","engine","optional","stkSwitch","stkDelete","stkRecover","stkAddons","memWslOff","wslAction","instUse","reqStart","expose","ctr","rmImage","cacheDelete","elCheck","elAddons","elPrepare","elApply","elSaveCreds","instDeleteGo","vmMemApply","ixTest","saveCreds","regLogin","useLocal","openDir","admOpenCache","openCache","instViewer","deskOpen","showAccess","lastRun","instOpen","saveSources","checkSources","testSsh","admLicense","renderAdmin","renderInstallations","renderHostMem","renderStack","renderCacheCard","renderEngine","instOtherPorts","logs","stkSwitch"]) if (typeof window[n] === 'function') window[n] = spinWrap(window[n]);
</script>
